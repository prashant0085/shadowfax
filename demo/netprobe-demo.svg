<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Animated netprobe terminal demo">
  <style>
    .terminal { fill: #0d1117; }
    .bar { fill: #161b22; }
    .title { fill: #8b949e; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .text { fill: #c9d1d9; font: 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .muted { fill: #8b949e; }
    .cyan { fill: #58a6ff; }
    .green { fill: #3fb950; }
    .yellow { fill: #d29922; }
    .red { fill: #f85149; }
    .line { opacity: 0; animation: appear 0.35s ease-out forwards; }
    .l1 { animation-delay: .5s; }
    .l2 { animation-delay: 1.0s; }
    .l3 { animation-delay: 1.5s; }
    .l4 { animation-delay: 2.0s; }
    .l5 { animation-delay: 2.5s; }
    .l6 { animation-delay: 3.0s; }
    .l7 { animation-delay: 3.5s; }
    .l8 { animation-delay: 4.0s; }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes appear { to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>

  <rect class="terminal" x="0" y="0" width="900" height="520" rx="12"/>
  <rect class="bar" x="0" y="0" width="900" height="38" rx="12"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="19" r="6" fill="#27c93f"/>
  <text class="title" x="450" y="24" text-anchor="middle">netprobe — network diagnostics</text>

  <text class="text" x="28" y="72"><tspan class="green">$</tspan> netprobe -f pinglist.txt -n 10</text>
  <text class="muted line l1" x="28" y="103">Probing endpoints in parallel...</text>
  <text class="text line l2" x="28" y="134">[01/08] Router               192.168.1.1       OK</text>
  <text class="text line l3" x="28" y="165">[02/08] Cloudflare DNS       1.1.1.1           OK</text>
  <text class="text line l4" x="28" y="196">[03/08] Zerodha Kite API     api.kite.trade     OK</text>
  <text class="text line l5" x="28" y="227">[04/08] NSE                  www.nseindia.com    OK</text>
  <text class="text line l6" x="28" y="258">[08/08] GitHub               github.com          OK</text>

  <text class="cyan line l7" x="28" y="302">+----------------------+--------------------------+----------+</text>
  <text class="cyan line l7" x="28" y="326">| NETPROBE             | ICMP LATENCY DASHBOARD   | AVG ms   |</text>
  <text class="cyan line l7" x="28" y="350">+----------------------+--------------------------+----------+</text>
  <text class="text line l8" x="28" y="379">| Router               | 192.168.1.1              |  4.742   | <tspan class="green">OK</tspan></text>
  <text class="text line l8" x="28" y="405">| Zerodha Kite API     | api.kite.trade           | 19.640   | <tspan class="green">OK</tspan></text>
  <text class="text line l8" x="28" y="431">| GitHub               | github.com               | 46.533   | <tspan class="green">OK</tspan></text>
  <text class="muted line l8" x="28" y="475">SUMMARY: 8 OK | 0 NO ICMP | 0 LOSS</text>
  <circle class="green pulse" cx="855" cy="475" r="5"/>
</svg>
